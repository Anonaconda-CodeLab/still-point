name: Android APK
# Builds the Android app (mobile/) from the same web app in dist/ and signs it with the studio's release key kept in the
# repository secrets. Pushes to main publish the "android-test" pre-release. The official release is published by a
# version tag (v1.2.3) or, more simply, by running this workflow by hand with "release" ticked (it then creates the tag);
# its notes carry the changelog entry, the APK's SHA-256 checksum and the signing certificate's fingerprint.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src/**', 'dist/**', 'docs/MANUAL.md', 'build.mjs', 'package.json', 'CHANGELOG.md', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the official release (tag v<version from package.json>) from this commit'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
env:
  APK_NAME: StillPoint
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app
        env:
          APP_BUILD_ID: ${{ github.sha }}   # shown as "build abc1234" in the APK's About (only here, so the committed page stays the same)
        run: node build.mjs
      - name: Copy it into the Android project
        working-directory: mobile
        run: npm ci && npx cap sync android
      - name: Signing key
        # One studio key for all apps. Accepts the STUDIO_* or LEADONE_* secrets (shared with Lead One) or the older RELEASE_* names;
        # the key alias is read from the keystore itself unless a *_KEY_ALIAS secret is set.
        env:
          KS: ${{ secrets.STUDIO_KEYSTORE_B64 || secrets.LEADONE_KEYSTORE_B64 || secrets.RELEASE_KEYSTORE_B64 }}
          PW: ${{ secrets.STUDIO_KEYSTORE_PASSWORD || secrets.LEADONE_KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.STUDIO_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "No signing key in the secrets."; exit 0; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ -z "$ALIAS" ]; then
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" 2>/dev/null | grep -i "PrivateKeyEntry" | head -1 | cut -d, -f1)
          fi
          if [ -z "$ALIAS" ]; then echo "::error::The signing key could not be opened. Check that the keystore and password secrets belong together."; exit 1; fi
          echo "Signing with key alias: $ALIAS"
          { echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks"; echo "RELEASE_KEY_ALIAS=$ALIAS"; } >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: mobile/android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD || secrets.LEADONE_KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD || secrets.LEADONE_KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e; ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; status=${PIPESTATUS[0]}; set -e
          if [ "$status" != 0 ]; then
            # show the reason as an annotation on the run page
            msg=$(grep -E -A4 "error:|What went wrong|Lint found" "$RUNNER_TEMP/gradle.log" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Android build failed::$msg"
            exit "$status"
          fi
      - name: Require the release key
        run: |
          if [ ! -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::The app compiled, but it is unsigned. Add the repository secrets LEADONE_KEYSTORE_B64 and LEADONE_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi
      - name: Check the APK (no internet permission, signed with the published key)
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::INTERNET permission found"; exit 1; fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "certificate SHA-256 digest" | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Signing certificate SHA-256: $CERT"
          # the APK must be signed with the published key (certSha256 in build.mjs), or nothing is published
          WANT=$(node -e "const m=/certSha256: '([0-9A-F:]+)'/.exec(require('fs').readFileSync('build.mjs','utf8')); console.log(m ? m[1] : '')")
          if [ "$CERT" != "$WANT" ]; then echo "::error::Signed with $CERT, but the published fingerprint is $WANT"; exit 1; fi
          echo "CERT=$CERT" >> "$GITHUB_ENV"
          VER=$(node -p "require('./package.json').version")
          cp "$APK" "$APK_NAME-$VER.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ env.VER }}-apk
          path: ${{ env.APK_NAME }}-${{ env.VER }}.apk
      - name: Publish the official release (version tag, or run by hand with "release" ticked)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAG" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VER"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" != tag ] && gh release view "$TAG" >/dev/null 2>&1; then echo "::error::Release $TAG already exists; raise the version first"; exit 1; fi
          F="$APK_NAME-$VER.apk"; SUM=$(sha256sum "$F" | cut -d' ' -f1); echo "$SUM  $F" > "$F.sha256"
          { awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md
            echo; echo "## Download and check"
            echo "- **$F** (below). Install guide: https://stillpoint.anonacondacodelab.com/android.html"
            echo "- SHA-256 of the APK: \`$SUM\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo; echo "Built by GitHub Actions from this tag's source code (also attached below). No internet permission."; } > notes.md
          if [ "$GITHUB_REF_TYPE" = tag ]; then gh release create "$TAG" "$F" "$F.sha256" --verify-tag --latest --title "Still Point $VER" --notes-file notes.md
          else gh release create "$TAG" "$F" "$F.sha256" --target "$GITHUB_SHA" --latest --title "Still Point $VER" --notes-file notes.md; fi
      - name: Publish as the android-test pre-release
        if: github.ref == 'refs/heads/main' && !inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test "$APK_NAME-$VER.apk" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Android test build $VER (build ${{ github.run_number }})" \
            --notes "Test build of the Android app, made automatically from commit ${GITHUB_SHA::7}. Install over the previous test build; your history is kept."
